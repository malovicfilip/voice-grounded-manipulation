name: offline-safety-regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate configured Isaac scene contract
        run: python isaac_sim/scripts/build_phase_1_scene.py --validate-only
      - name: Compile Python
        run: python -m compileall -q ros2_ws/src/vgm_runtime isaac_sim/scripts tests
      - name: Parse browser JavaScript
        run: node --check isaac_sim/browser_console/app.js && node --check isaac_sim/web_viewer/server.mjs
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find . -type f -name '*.sh' -print0)
          bash -n ./demo
      - name: Parse checked-in JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if any(part in {'.git', 'build', 'install', 'log'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
      - name: Demo launcher passive preflight
        run: ./demo doctor --mode replay --json
